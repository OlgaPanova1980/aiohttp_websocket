<!DOCTYPE html>
<meta charset="utf-8" />
<html>

<head>
    <title>News WebSocket Client</title>
    <script language="javascript" type="text/javascript">
        document.addEventListener("DOMContentLoaded", function () {
            var conn = null;
            var pingInterval = null;

            function log(msg) {
                var control = document.getElementById('log');
                control.innerHTML = control.innerHTML + msg + '<br/>';
                control.scrollTop = control.scrollTop + 1000;
            }

            function connect() {
                disconnect();
                var wsUri = (window.location.protocol == 'https:' ? 'wss://' : 'ws://') + window.location.host + '/ws';
                conn = new WebSocket(wsUri);
                log('Connecting to news feed...');

                conn.onopen = function () {
                    log('Connected to news feed.');
                    update_ui();

                    pingInterval = setInterval(function () {
                        if (conn && conn.readyState === WebSocket.OPEN) {
                            conn.send("ping");
                        }
                    }, 5000);
                };

                conn.onmessage = function (e) {
                    if (e.data === "pong") {
                        return;
                    }
                    log('<b>New News:</b> ' + e.data);
                };

                conn.onclose = function () {
                    log('Disconnected from news feed.');
                    conn = null;
                    update_ui();
                    if (pingInterval) {
                        clearInterval(pingInterval);
                    }
                };
            }

            function disconnect() {
                if (conn != null) {
                    conn.close();
                    conn = null;
                    update_ui();
                    if (pingInterval) {
                        clearInterval(pingInterval);
                    }
                }
            }

            function update_ui() {
                var statusSpan = document.getElementById('status');
                var connectBtn = document.getElementById('connect');
                if (conn == null) {
                    statusSpan.textContent = 'disconnected';
                    connectBtn.innerHTML = 'Connect to News';
                } else {
                    statusSpan.textContent = 'connected';
                    connectBtn.innerHTML = 'Disconnect';
                }
            }

            document.getElementById('connect').addEventListener('click', function (e) {
                e.preventDefault();
                if (conn == null) {
                    connect();
                } else {
                    disconnect();
                }
                update_ui();
            });
        });
    </script>
</head>

<body style="font-family: Arial, sans-serif; margin: 20px;">
    <h3>News Feed (WebSockets)</h3>
    <div>
        <button id="connect">Connect to News</button>&nbsp;Status: <span id="status">disconnected</span>
    </div>
    <div id="log"
        style="width:400px; height:300px; overflow:auto; border:1px solid black; margin: 10px 0; padding: 10px; background: #fafafa;">
    </div>
</body>

</html>
